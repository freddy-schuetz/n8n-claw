use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "{{SEARXNG_SECRET_KEY}}"

search:
  formats:
    - html
    - json
  default_lang: "de"
  # SearXNG sperrt eine Engine nach einem Fehler fuer eine feste Zeit. Die
  # Defaults sind fuer Server-IPs viel zu lang: ein einziger Cloudflare-CAPTCHA
  # sperrt die Engine 15 Tage (1296000 s), reCAPTCHA 7 Tage. Auf einem VPS
  # laufen genau diese Sperren staendig auf, die Websuche faellt dann tagelang
  # aus und erholt sich nur sporadisch. Eine Stunde reicht voellig: das sind
  # 24 Versuche pro Tag, also weit entfernt von aggressivem Nachfassen.
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 1800
    SearxEngineTooManyRequests: 180
    cf_SearxEngineCaptcha: 3600
    cf_SearxEngineAccessDenied: 3600
    recaptcha_SearxEngineCaptcha: 3600

engines:
  - name: google
    engine: google
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    disabled: false
  - name: brave
    engine: brave
    disabled: false
  - name: wikipedia
    engine: wikipedia
    disabled: false
  # Bing ist in SearXNG per Default deaktiviert, blockiert aber als einzige der
  # grossen Engines keine Rechenzentrums-IPs. Ohne sie faellt die Websuche auf
  # einem VPS komplett aus, sobald Google/DDG/Brave/Startpage die Server-IP mit
  # CAPTCHA bzw. 429 sperren (SLT-VPS 30.07.2026: 5 von 5 Engines tot, Bing ok).
  - name: bing
    engine: bing
    disabled: false
