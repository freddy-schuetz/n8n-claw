use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "{{SEARXNG_SECRET_KEY}}"

search:
  formats:
    - html
    - json
  default_lang: "de"

engines:
  - name: google
    engine: google
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    disabled: false
  - name: brave
    engine: brave
    disabled: false
  - name: wikipedia
    engine: wikipedia
    disabled: false
  # Bing ist in SearXNG per Default deaktiviert, blockiert aber als einzige der
  # grossen Engines keine Rechenzentrums-IPs. Ohne sie faellt die Websuche auf
  # einem VPS komplett aus, sobald Google/DDG/Brave/Startpage die Server-IP mit
  # CAPTCHA bzw. 429 sperren (SLT-VPS 30.07.2026: 5 von 5 Engines tot, Bing ok).
  - name: bing
    engine: bing
    disabled: false
